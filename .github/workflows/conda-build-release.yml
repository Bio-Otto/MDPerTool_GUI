name: Conda Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v0.0.5)'
        required: true
        type: string
      publish_to_anaconda:
        description: 'Upload package to anaconda.org'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build noarch conda package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.9'
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Install build tooling
        shell: bash -el {0}
        run: |
          conda install -y conda-build anaconda-client

      - name: Build conda package
        shell: bash -el {0}
        run: |
          mkdir -p build_output
          conda build conda.recipe -c conda-forge --output-folder build_output
          find build_output -type f | head -100

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: conda-pkg
          path: build_output/**/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release and package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: conda-pkg
          path: artifacts

      - name: Setup Miniconda for upload
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.9'
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Upload package to anaconda.org
        if: github.event_name == 'push' || github.event.inputs.publish_to_anaconda == 'true'
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          TOKEN="${ANACONDA_TOKEN:-$ANACONDA_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Anaconda token found. Set ANACONDA_TOKEN or ANACONDA_API_TOKEN in repository secrets."
            exit 1
          fi
          PACKAGE=$(find artifacts -type f \( -name "mdpertool-*.conda" -o -name "mdpertool-*.tar.bz2" \) | head -1)
          if [ -z "$PACKAGE" ]; then
            echo "No package file found to upload"
            exit 1
          fi
          anaconda --token "$TOKEN" upload -u bio-otto "$PACKAGE" --skip-existing

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/**/*.conda
            artifacts/**/*.tar.bz2
          overwrite_files: true
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
