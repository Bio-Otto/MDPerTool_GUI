name: Conda Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Install build tools
        shell: bash -el {0}
        run: |
          conda install -y conda-build anaconda-client

      - name: Build conda package
        shell: bash -el {0}
        run: |
          mkdir -p build_output
          echo "Building on ${{ matrix.os }}..."
          conda build conda.recipe \
            -c conda-forge \
            --output-folder build_output \
            --no-test || echo "Build failed, checking for partial outputs..."
          ls -la build_output/noarch/ 2>/dev/null || echo "No noarch directory found"

      - name: List build outputs
        shell: bash -el {0}
        if: always()
        run: |
          echo "Build output directory:"
          find build_output -type f 2>/dev/null | head -20 || echo "No build outputs found"
          echo ""
          echo "Looking for packages:"
          find build_output -name "*.conda" -o -name "*.tar.bz2" 2>/dev/null | head -10 || echo "No packages found"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conda-pkg-${{ matrix.os }}
          path: build_output
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && success()

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Setup Miniconda for upload
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.9'
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Upload package to anaconda.org
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          TOKEN="${ANACONDA_TOKEN:-$ANACONDA_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Anaconda token found. Set ANACONDA_TOKEN or ANACONDA_API_TOKEN in repository secrets."
            exit 1
          fi
          export ANACONDA_API_TOKEN="$TOKEN"
          echo "Anaconda token detected (length: ${#TOKEN})."
          conda install -y anaconda-client
          echo "Artifacts downloaded:"
          find artifacts -type f | head -100 || true
          PACKAGE=$(find artifacts/conda-pkg-windows-latest -type f \( -name "mdpertool-*.conda" -o -name "mdpertool-*.tar.bz2" \) | head -1)
          if [ -z "$PACKAGE" ]; then
            PACKAGE=$(find artifacts -type f \( -name "mdpertool-*.conda" -o -name "mdpertool-*.tar.bz2" \) | head -1)
          fi
          if [ -z "$PACKAGE" ]; then
            echo "No package file found to upload"
            exit 1
          fi
          echo "Uploading $PACKAGE"
          anaconda --token "$TOKEN" upload -u bio-otto "$PACKAGE" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.conda
            artifacts/**/*.tar.bz2
          overwrite_files: true
          fail_on_unmatched_files: false
          append_body: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
