name: Conda Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v0.0.8)'
        required: true
        type: string
      publish_to_anaconda:
        description: 'Upload package to anaconda.org'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-smoke:
    name: Build (${{ matrix.label }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-13, windows-latest]
        include:
          - os: ubuntu-latest
            label: linux-64
          - os: macos-13
            label: osx-64
          - os: windows-latest
            label: win-64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Install build tooling
        shell: bash -el {0}
        run: |
          pip uninstall conda-content-trust -y || true
          # Create an isolated env with the exact target Python so conda-build
          # inherits the correct Python version without touching the base env.
          conda create -y -n buildenv \
            -c conda-forge \
            "python=${{ matrix.python-version }}" conda-build anaconda-client
          conda run -n buildenv python --version

      - name: Build conda package
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p build_output

          # Nuclear: delete any conda_build_config.yaml files in buildenv.
          # conda-forge-pinning ships one that keeps overriding our python variant.
          ENV_PREFIX="${CONDA}/envs/buildenv"
          echo "=== Searching for pinning files in $ENV_PREFIX ==="
          find "$ENV_PREFIX" -name "conda_build_config.yaml" 2>/dev/null | while read -r f; do
            echo "Found and removing: $f"
            rm -f "$f"
          done

          # Write exclusive variant config with the exact matrix Python
          {
            echo "python:"
            echo "  - \"${{ matrix.python-version }}\""
            echo "pin_run_as_build:"
            echo "  python:"
            echo "    min_pin: x.x"
            echo "    max_pin: x.x"
          } > "$(pwd)/variant_config.yaml"
          echo "=== variant_config.yaml ==="
          cat "$(pwd)/variant_config.yaml"

          echo "=== buildenv Python version ==="
          conda run -n buildenv python --version
          echo "=== conda-build version ==="
          conda run -n buildenv conda-build --version || true

          echo "=== Dry-run: expected output filename ==="
          conda run --no-capture-output -n buildenv \
            conda build conda.recipe \
              -c conda-forge \
              --python "${{ matrix.python-version }}" \
              --exclusive-config-files "$(pwd)/variant_config.yaml" \
              --output || true

          echo "=== Actual build ==="
          conda run --no-capture-output -n buildenv \
            conda build conda.recipe \
              -c conda-forge \
              --output-folder "$(pwd)/build_output" \
              --no-test \
              --python "${{ matrix.python-version }}" \
              --exclusive-config-files "$(pwd)/variant_config.yaml"
          find build_output -type f

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-pkg-${{ matrix.label }}-py${{ matrix.python-version }}
          path: build_output/**/*.conda
          retention-days: 14
          if-no-files-found: error

      - name: Smoke test — install from build output
        shell: bash -el {0}
        run: |
          set -euo pipefail

          conda run -n buildenv python -m conda_index "$(pwd)/build_output"

          conda create -y -n smoke \
            -c "$(pwd)/build_output" \
            -c conda-forge \
            -c defaults \
            "mdpertool=0.0.8" "python=${{ matrix.python-version }}"

          conda run -n smoke python -c "import openmm; print('openmm', openmm.__version__)"
          conda run -n smoke python -c "from mdpertool._version import __version__; print('mdpertool', __version__)"
          conda run -n smoke mdpertool --help
          conda run -n smoke mdpertool cli --help

  release:
    name: Publish release and package
    needs: [build-and-smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: conda-pkg-*

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Setup Miniconda for upload
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: '3.11'
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Upload packages to anaconda.org
        if: github.event_name == 'push' || github.event.inputs.publish_to_anaconda == 'true'
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          TOKEN="${ANACONDA_TOKEN:-$ANACONDA_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Anaconda token found. Set ANACONDA_TOKEN or ANACONDA_API_TOKEN in repository secrets."
            exit 1
          fi

          pip uninstall conda-content-trust -y || true
          conda install -y anaconda-client
          export BINSTAR_TOKEN="$TOKEN"
          export ANACONDA_API_TOKEN="$TOKEN"

          echo "Checking token..."
          binstar whoami || true

          mapfile -t PACKAGES < <(find artifacts -type f \( -name "mdpertool-*.conda" -o -name "mdpertool-*.tar.bz2" \) | sort -u)
          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "No packages found to upload"
            exit 1
          fi

          echo "Uploading ${#PACKAGES[@]} package(s)..."
          for PACKAGE in "${PACKAGES[@]}"; do
            echo "  -> $PACKAGE"
            binstar upload -u bio-otto "$PACKAGE" --skip-existing
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: artifacts/**/*.conda
          overwrite_files: true
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
