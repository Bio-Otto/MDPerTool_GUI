name: Conda Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v0.0.5)'
        required: true
        type: string
      publish_to_anaconda:
        description: 'Upload package to anaconda.org'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Install build tooling
        shell: bash -el {0}
        run: |
          conda install -y conda-build anaconda-client

      - name: Build conda package
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p build_output
          conda build conda.recipe \
            -c conda-forge \
            --output-folder build_output \
            --no-test
          find build_output -type f | head -100

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: conda-pkg-${{ matrix.os }}
          path: build_output/**/*
          retention-days: 14
          if-no-files-found: error

  install-smoke:
    name: Fresh Install Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create clean env and install package artifact
        shell: bash -el {0}
        run: |
          set -euo pipefail
          PACKAGE="$(find artifacts -type f \( -path '*/noarch/mdpertool-*.conda' -o -path '*/noarch/mdpertool-*.tar.bz2' \) | sort -u | head -n 1)"
          if [ -z "$PACKAGE" ]; then
            PACKAGE="$(find artifacts -type f \( -name 'mdpertool-*.conda' -o -name 'mdpertool-*.tar.bz2' \) | sort -u | head -n 1)"
          fi
          if [ -z "$PACKAGE" ]; then
            echo "No package artifact found"
            exit 1
          fi
          echo "Using package artifact: $PACKAGE"

          conda create -y -n mdpertool-smoke "python=${{ matrix.python-version }}"
          conda install -y -n mdpertool-smoke \
            --override-channels \
            --strict-channel-priority \
            -c conda-forge \
            "$PACKAGE"

      - name: Smoke test installed package
        shell: bash -el {0}
        run: |
          set -euo pipefail
          conda run -n mdpertool-smoke python -c "import openmm; print(openmm.__version__)"
          conda run -n mdpertool-smoke mdpertool --help
          conda run -n mdpertool-smoke mdpertool cli --help

  release:
    name: Publish release and package
    needs: [build, install-smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Setup Miniconda for upload
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base
          miniconda-version: latest

      - name: Upload package to anaconda.org
        if: github.event_name == 'push' || github.event.inputs.publish_to_anaconda == 'true'
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          TOKEN="${ANACONDA_TOKEN:-$ANACONDA_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Anaconda token found. Set ANACONDA_TOKEN or ANACONDA_API_TOKEN in repository secrets."
            exit 1
          fi
          conda install -y anaconda-client
          
          # Use BINSTAR_TOKEN / ANACONDA_API_TOKEN instead of interactive login
          export BINSTAR_TOKEN="$TOKEN"
          export ANACONDA_API_TOKEN="$TOKEN"
          
          echo "Testing token authentication..."
          binstar whoami || true
          
          mapfile -t PACKAGES < <(find artifacts -type f \( -name "mdpertool-*.conda" -o -name "mdpertool-*.tar.bz2" \) | sort -u)
          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "No package file found to upload"
            exit 1
          fi
          
          for PACKAGE in "${PACKAGES[@]}"; do
            echo "Uploading $PACKAGE"
            binstar upload -u bio-otto "$PACKAGE" --skip-existing
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/**/*.conda
            artifacts/**/*.tar.bz2
          overwrite_files: true
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
