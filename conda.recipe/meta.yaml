
{% set name = "mdpertool" %}
{% set version = "0.0.8" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ..

build:
  number: 0
  script: python -m pip install . --no-deps --ignore-installed -vv
  entry_points:
    - mdpertool = mdpertool.launcher:run_mdpertool

requirements:
  host:
    - pip
    - python >=3.10,<3.13
    - setuptools

  run:
    - python >=3.10,<3.13
    - setuptools
    - lxml
    - pyside2 >=5.15,<6
    - matplotlib
    - pandas
    - pyqtgraph
    - openmm >=8.5,<8.6
    - networkx
    - pdbfixer
    - pyopengl
    - pymol-open-source >=2.5
    - biopython
    - prody
    - pyqtwebengine
    - pyyaml
    - pystache
    - parmed
    - mdtraj >=1.9.7
    - mdanalysis

test:
  requires:
    - pytest
  commands:
    - mdpertool --help
    - mdpertool cli --help
    - python -c "from mdpertool._version import __version__; assert __version__ == '0.0.8'"
  imports:
    - mdpertool

about:
  home: "https://github.com/Bio-Otto/MDPerTool_GUI"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "A Software Tool for Investigation of Allosteric Communication within Proteins via Energy Dissipation Concept"
  description: |
    A tool for investigating allosteric communication in proteins via the Energy Dissipation Concept,
    powered by OpenMM (CUDA supported).

    INSTALLATION — the Anaconda page shows a short command that omits required channels.
    Use the full command below instead:

      conda create -n mdpertool -c conda-forge -c bio-otto bio-otto::mdpertool
      conda activate mdpertool

    Or into an existing environment (Python 3.10–3.13 required):

      conda install -c conda-forge -c bio-otto bio-otto::mdpertool

  dev_url: "https://github.com/Bio-Otto/MDPerTool_GUI"

extra:
  recipe-maintainers:
    - Bio-Otto
